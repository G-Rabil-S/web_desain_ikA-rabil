<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Bayar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<section class="position-relative text-white" style="
    background-image: url('https://i.pinimg.com/1200x/f7/6d/41/f76d41e775131a30df8fa6bdb2459c12.jpg');
    background-size: cover;
    background-position: center;
    min-height: 20vh;">

    <!-- Overlay -->
    <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50"></div>

    <!-- Content -->
    <div class="container position-relative text-center py-5" style="z-index: 2;">
        <h1 class="fw-bold text-white">
            Halaman Transaksi
        </h1>
        <p class="lead text-white w-75 mx-auto">
            Silakan lakukan pembayaran untuk menyelesaikan transaksi Anda.
            Pastikan untuk memeriksa detail pembayaran dan mengikuti petunjuk yang diberikan.
        </p>
    </div>

</section>

<section class="container py-5">
    <div class="container py-4">
        <div class="row">

            <!-- Form Transaksi -->
            <div class="col-md-6">
                <div class="card bg-dark text-white p-3 shadow">
                    <h3 class="mb-3">Proses Transaksi</h3>

                    <form onsubmit="pesanProduk();return false;">
                        <div class="mb-3">
                            <label class="form-label">Produk</label>
                            <select id="pilihan_produk" class="form-select" disabled></select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nama Pembeli</label>
                            <input id="nama_pembeli" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Jumlah (Bulan)</label>
                            <input id="jumlah" type="number" min="1" value="1" class="form-control"
                                oninput="hitungTotal()">
                        </div>

                        <hr class="border-light">

                        <h5>Total: <span id="total_pemesanan">Rp 0</span></h5>

                        <button class="btn btn-success w-100">
                            Pesan Sekarang
                        </button>
                    </form>
                </div>
            </div>

            <!-- Riwayat Transaksi -->
            <div class="col-md-6">
                <div class="card bg-dark text-white p-3 shadow">
                    <h3 class="mb-3">Riwayat Transaksi</h3>

                    <table class="table table-dark table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Kost</th>
                                <th>Harga</th>
                                <th>Pembeli</th>
                                <th>Bulan</th>
                            </tr>
                        </thead>
                        <tbody id="table-riwayat"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
    <div class="text-center mt-5">
        <a href="webnetkos.html" class="btn btn-outline-primary my-2">Kembali</a>
    </div>
    <script src="script.js"></script>
</section>

</html>
